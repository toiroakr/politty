name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false
      - name: Report all known vulnerabilities
        run: pnpm audit
        continue-on-error: true
      - name: Reject other high and critical vulnerabilities
        run: |
          pnpm audit --audit-level high --ignore GHSA-fc5q-39xc-vjpf
          pnpm audit --audit-level high
