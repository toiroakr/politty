name: Preview

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  preview: # karinto: ignore[use-trusted-publishing] pkg-pr-new auths via the job's GITHUB_TOKEN, not a long-lived npm token
    name: Preview
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read # checkout the repository
      pull-requests: write # pkg-pr-new comments the preview install command on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          standalone: true
          run_install: false
      - name: Install Node.js
        run: pnpm env use --global 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Publish preview
        run: pnpm dlx pkg-pr-new@0.0.88 publish --commentWithSha --compact ./packages/zod ./packages/valibot ./packages/zod-mini ./packages/politty
