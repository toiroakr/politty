name: autofix.ci

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/core/package.json"
      - "packages/core/scripts/sync-agent-spec.mjs"
      - "packages/core/src/agent/spec/**"

concurrency:
  group: agent-spec-sync-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  agent-spec-sync:
    name: Sync Agent Spec
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read # checkout only; autofix-ci/action commits via its own credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          standalone: true
          run_install: false
      - name: Install Node.js
        run: pnpm env use --global 24
        shell: bash
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash
      - name: Sync vendored detect-agent spec
        run: pnpm --filter @politty/core sync:agent-spec
        shell: bash
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
