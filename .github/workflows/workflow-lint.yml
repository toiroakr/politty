name: Workflow Lint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.0
      - name: ghalint
        run: ghalint run
        env:
          GHALINT_LOG_COLOR: always
      - name: pinact
        run: pinact run
      - name: karinto
        run: |
          set -euo pipefail
          exit_code=0
          while IFS= read -r -d '' f; do
            resp=$(curl -sS -X POST \
              --data-urlencode "content@${f}" \
              --data-urlencode "path=${f}" \
              https://karinto.toiroakr.workers.dev)
            echo "::group::karinto: ${f}"
            echo "${resp}" | jq .
            echo "::endgroup::"
            errors=$(echo "${resp}" | jq '[.result.diagnostics[]? | select(.severity == "error")] | length')
            if [ "${errors}" -gt 0 ]; then
              echo "::error file=${f}::karinto found ${errors} error-severity diagnostic(s)"
              exit_code=1
            fi
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          exit "${exit_code}"
