name: autofix.ci

on:
  pull_request:
    branches: [main]
    paths:
      - "aqua.yaml"
      - "aqua-checksums.json"

concurrency:
  group: aqua-checksum-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  aqua-checksum:
    name: Update Aqua Checksum
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read # checkout only; autofix-ci/action commits via its own credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2
      - name: Update checksum
        run: aqua upc -prune
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
