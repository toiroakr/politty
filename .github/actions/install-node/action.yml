name: Install Node.js
description: >-
  Installs Node.js with `pnpm env use --global`, retrying when the download
  stalls. nodejs.org downloads have hung at a few MB for the rest of the job
  timeout, cancelling the whole job; a stalled attempt is killed and retried
  instead. Run it after pnpm is installed.

inputs:
  version:
    description: Node.js version or major to install (passed to `pnpm env use`)
    required: true
  attempts:
    description: Maximum number of install attempts
    required: false
    default: "3"
  attempt-timeout-seconds:
    description: Seconds after which one attempt is considered stalled and killed
    required: false
    default: "120"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        NODE_VERSION: ${{ inputs.version }}
        ATTEMPTS: ${{ inputs.attempts }}
        ATTEMPT_TIMEOUT: ${{ inputs.attempt-timeout-seconds }}
      # `timeout` is missing on macOS and shadowed by timeout.exe on Windows,
      # so the stall is detected by polling the PID in plain bash.
      run: |
        for attempt in $(seq 1 "$ATTEMPTS"); do
          pnpm env use --global "$NODE_VERSION" &
          pid=$!
          elapsed=0
          while kill -0 "$pid" 2>/dev/null; do
            if [ "$elapsed" -ge "$ATTEMPT_TIMEOUT" ]; then
              echo "::warning::Installing Node.js $NODE_VERSION stalled for ${ATTEMPT_TIMEOUT}s (attempt $attempt/$ATTEMPTS); killing it"
              kill "$pid" 2>/dev/null || true
              break
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done
          if wait "$pid"; then
            exit 0
          fi
          echo "::warning::Installing Node.js $NODE_VERSION failed (attempt $attempt/$ATTEMPTS)"
        done
        echo "::error::Could not install Node.js $NODE_VERSION after $ATTEMPTS attempts"
        exit 1
